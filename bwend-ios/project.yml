name: Bwend
options:
  bundleIdPrefix: com.bwend
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "7JSY6J5R99"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_STRICT_CONCURRENCY: "minimal"

targets:
  Bwend:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BwendApp
        excludes:
          - "Resources/Fonts/README.md"
    resources:
      - BwendApp/Resources/Assets.xcassets
    info:
      path: BwendApp/Info.plist
      properties:
        CFBundleDisplayName: Bwend
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: "bg-primary"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: []
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSAppleMusicUsageDescription: "Bwend uses MusicKit to play previews of the tracks you share."
        LSApplicationQueriesSchemes:
          - spotify
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.bwend.app.callbacks
            CFBundleURLSchemes:
              - bwend
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        SPOTIFY_CLIENT_ID: 593e4f5104c8411885d53b88223f3db2
        BWEND_API_URL: https://helpful-owl-232.eu-west-1.convex.site/api
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bwend.app
        INFOPLIST_FILE: BwendApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_ENTITLEMENTS: BwendApp/Bwend.entitlements
