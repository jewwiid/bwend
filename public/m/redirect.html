<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Bwend…</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fdfbf7;
      color: #14120f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p {
      font-size: 15px;
      color: #4a4540;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eab4a8;
      border-top-color: #e8919a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      background: #e8919a;
      color: white;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Opening Bwend…</h1>
    <p id="message">Someone wants to blend with you. If Bwend doesn't open automatically, tap below.</p>
    <a id="fallback" class="btn" href="#">Open Bwend</a>
  </div>
  <script>
    // Extract the invite code from the URL path: /m/<code> or /m/redirect.html?code=<code>
    var path = window.location.pathname;
    var code = null;

    // Direct path: bwend.xyz/m/k7m3xrq2
    var match = path.match(/^\/m\/([a-z0-9]+)$/i);
    if (match) {
      code = match[1];
    }

    // Query param fallback (in case the SPA router passes it through)
    if (!code) {
      var params = new URLSearchParams(window.location.search);
      code = params.get('code');
    }

    if (code) {
      // Try to open the app via the custom scheme. If the app is installed, it opens and this
      // page gets hidden. If not, the timer fires and we show the App Store fallback.
      var deepLink = 'bwend://m/' + code;
      window.location.href = deepLink;

      // The "Open Bwend" button retries the deep link.
      document.getElementById('fallback').href = deepLink;

      // After 2 seconds, if we're still here, the app isn't installed — swap to App Store.
      setTimeout(function() {
        document.getElementById('message').textContent =
          "Looks like Bwend isn't installed yet. Get it on the App Store, then come back to this link.";
        document.getElementById('fallback').textContent = 'Get Bwend';
        // TODO: replace with actual App Store URL once the app is published.
        document.getElementById('fallback').href = 'https://apps.apple.com/app/bwend';
      }, 2000);
    } else {
      // No code found — just send them to the landing page.
      window.location.href = '/';
    }
  </script>
</body>
</html>
